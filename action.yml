name: "Release & PR Digest to Slack"
description: "Post a weekly merged-PR digest (or a per-release digest) to Slack. Deterministic template, no LLM, stdlib Python."
author: "SaaS Ops Tune-Up"
branding:
  icon: "package"
  color: "blue"

inputs:
  slack-webhook-url:
    description: "Slack Incoming Webhook URL. Pass from a secret. If empty, the digest is printed only (never posted)."
    required: false
    default: ""
  mode:
    description: "'weekly' = PRs merged in the last N days; 'release' = PRs referenced by a release."
    required: false
    default: "weekly"
  days:
    description: "Look-back window for weekly mode."
    required: false
    default: "7"
  release-tag:
    description: "Release mode only. Empty = tag from the release event, else latest release."
    required: false
    default: ""
  repo:
    description: "owner/name to summarize."
    required: false
    default: ${{ github.repository }}
  github-token:
    description: "Token with contents:read and pull-requests:read."
    required: false
    default: ${{ github.token }}
  dry-run:
    description: "'true' = never post to Slack, even if a webhook is set."
    required: false
    default: "false"
  fixture:
    description: "Path to a fixture JSON (offline test). Use 'sample' for the bundled weekly sample. Skips the GitHub API."
    required: false
    default: ""
  show-footer:
    description: "Include the one-line attribution footer in the Slack message."
    required: false
    default: "true"

outputs:
  pr-count:
    description: "Number of PRs in the digest."
    value: ${{ steps.digest.outputs.pr-count }}
  posted:
    description: "'true' if the digest was posted to Slack."
    value: ${{ steps.digest.outputs.posted }}
  digest-file:
    description: "Path to the rendered digest text file."
    value: ${{ steps.digest.outputs.digest-file }}

runs:
  using: "composite"
  steps:
    - id: digest
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        DIGEST_MODE: ${{ inputs.mode }}
        DIGEST_DAYS: ${{ inputs.days }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        GITHUB_REPO: ${{ inputs.repo }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DIGEST_DRY_RUN: ${{ inputs.dry-run }}
        DIGEST_FIXTURE: ${{ inputs.fixture }}
        DIGEST_SHOW_FOOTER: ${{ inputs.show-footer }}
      run: python3 "$GITHUB_ACTION_PATH/digest.py"
